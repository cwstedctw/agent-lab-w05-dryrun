<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Break Activity Picker</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17312b;
      --muted: #60736d;
      --paper: #fffdf7;
      --line: #d8e0d8;
      --accent: #176b58;
      --accent-dark: #0d4d3f;
      --soft: #eaf4ed;
      --warm: #f4c95d;
      --shadow: 0 18px 50px rgba(34, 66, 57, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(244, 201, 93, .25), transparent 28rem),
        linear-gradient(135deg, #eff7ef, #f8f3e7);
      font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    }

    button, select { font: inherit; }

    .page {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 680px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 7vw, 4.4rem);
      line-height: .96;
      letter-spacing: -.04em;
    }

    .language {
      display: inline-flex;
      flex: 0 0 auto;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .72);
    }

    .language button {
      min-width: 48px;
      padding: 8px 12px;
      border: 0;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .language button.active {
      color: white;
      background: var(--accent);
    }

    .panel {
      border: 1px solid rgba(23, 107, 88, .14);
      border-radius: 24px;
      background: rgba(255, 253, 247, .92);
      box-shadow: var(--shadow);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      padding: 22px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: .84rem;
      font-weight: 800;
      letter-spacing: .04em;
    }

    select {
      width: 100%;
      min-height: 48px;
      padding: 0 38px 0 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: white;
    }

    select:focus-visible, button:focus-visible {
      outline: 3px solid rgba(23, 107, 88, .25);
      outline-offset: 2px;
    }

    .actions {
      display: flex;
      gap: 10px;
      padding: 0 22px 22px;
    }

    .button {
      min-height: 48px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: white;
      font-weight: 800;
      cursor: pointer;
    }

    .button.primary {
      flex: 1;
      border-color: var(--accent);
      color: white;
      background: var(--accent);
    }

    .button.primary:hover { background: var(--accent-dark); }
    .button.secondary:hover { background: var(--soft); }

    .result {
      min-height: 230px;
      margin-top: 18px;
      padding: clamp(24px, 6vw, 48px);
      display: grid;
      align-content: center;
      overflow: hidden;
      position: relative;
    }

    .result::after {
      content: "";
      position: absolute;
      right: -65px;
      bottom: -85px;
      width: 210px;
      height: 210px;
      border: 34px solid rgba(244, 201, 93, .26);
      border-radius: 50%;
      pointer-events: none;
    }

    .result-id {
      width: max-content;
      margin: 0 0 12px;
      padding: 5px 10px;
      border-radius: 7px;
      color: var(--accent-dark);
      background: var(--warm);
      font-weight: 900;
      letter-spacing: .08em;
    }

    .result h2 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.75rem, 5vw, 3rem);
      line-height: 1.08;
    }

    .result .hint { margin: 0; color: var(--muted); font-size: 1.05rem; }

    .meta {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }

    .meta li {
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--soft);
      font-size: .9rem;
      font-weight: 700;
    }

    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 28px 2px 12px;
    }

    .history-head h2 { margin: 0; font-size: 1.15rem; }
    .clear { min-height: 38px; padding: 0 12px; font-size: .86rem; }

    .history {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .history li {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .67);
    }

    .history-id { color: var(--accent); font-weight: 900; }
    .history-name { font-weight: 750; }
    .history-meta { color: var(--muted); font-size: .84rem; text-align: right; }
    .empty-history { color: var(--muted); font-style: italic; }

    footer {
      margin-top: 30px;
      padding-top: 17px;
      border-top: 1px solid rgba(23, 49, 43, .18);
      color: var(--muted);
      font-size: .83rem;
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 22px, 980px); padding-top: 18px; }
      header { display: grid; }
      .language { justify-self: start; }
      .controls { grid-template-columns: 1fr; gap: 12px; padding: 17px; }
      .actions { padding: 0 17px 17px; flex-direction: column; }
      .button { width: 100%; }
      .result { min-height: 220px; }
      .history li { grid-template-columns: 48px 1fr; }
      .history-meta { grid-column: 2; text-align: left; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow" data-i18n="eyebrow">Between classes</p>
        <h1 data-i18n="title">Campus Break Activity Picker</h1>
      </div>
      <div class="language" role="group" aria-label="Language">
        <button type="button" id="lang-en" class="active" aria-pressed="true">EN</button>
        <button type="button" id="lang-zh" aria-pressed="false">中文</button>
      </div>
    </header>

    <section class="panel" aria-labelledby="filter-heading">
      <h2 id="filter-heading" hidden data-i18n="filters">Filters</h2>
      <div class="controls">
        <label>
          <span data-i18n="location">Location</span>
          <select id="location">
            <option value="all" data-i18n="allLocations">All locations</option>
            <option value="indoor" data-i18n="indoor">Indoor</option>
            <option value="outdoor" data-i18n="outdoor">Outdoor</option>
          </select>
        </label>
        <label>
          <span data-i18n="time">Available time</span>
          <select id="time">
            <option value="15" data-minutes="15">15 minutes</option>
            <option value="30" data-minutes="30" selected>30 minutes</option>
            <option value="60" data-minutes="60">60 minutes</option>
          </select>
        </label>
        <label>
          <span data-i18n="energy">Energy</span>
          <select id="energy">
            <option value="all" data-i18n="allEnergy">All energy levels</option>
            <option value="low" data-i18n="low">Low</option>
            <option value="medium" data-i18n="medium">Medium</option>
          </select>
        </label>
      </div>
      <div class="actions">
        <button type="button" class="button primary" id="pick" data-i18n="pick">Pick an activity</button>
        <button type="button" class="button secondary" id="reset" data-i18n="reset">Reset filters</button>
      </div>
    </section>

    <section class="panel result" id="result" aria-live="polite" aria-atomic="true">
      <p class="hint" data-i18n="ready">Choose your filters, then pick an activity.</p>
    </section>

    <section aria-labelledby="history-title">
      <div class="history-head">
        <h2 id="history-title" data-i18n="recent">Recent picks</h2>
        <button type="button" class="button clear" id="clear" data-i18n="clear">Clear history</button>
      </div>
      <ol class="history" id="history"></ol>
    </section>

    <footer data-i18n="disclaimer">Fictional teaching activities; not an official university announcement.</footer>
  </main>

  <script>
    // Embedded verbatim from activities.json so this one-file page works offline.
    const activities = [
      { id: "A01", name_zh: "整理書包", name_en: "Organize your bag", location_type: "indoor", minutes: 10, energy: "low" },
      { id: "A02", name_zh: "畫一張小卡", name_en: "Draw a small card", location_type: "indoor", minutes: 15, energy: "low" },
      { id: "A03", name_zh: "寫三句讀書筆記", name_en: "Write three study notes", location_type: "indoor", minutes: 10, energy: "low" },
      { id: "A04", name_zh: "安靜讀兩頁書", name_en: "Read two pages quietly", location_type: "indoor", minutes: 15, energy: "low" },
      { id: "A05", name_zh: "排好明日待辦", name_en: "Plan tomorrow’s tasks", location_type: "indoor", minutes: 20, energy: "low" },
      { id: "A06", name_zh: "整理本機練習檔", name_en: "Organize practice files", location_type: "indoor", minutes: 30, energy: "medium" },
      { id: "A07", name_zh: "在合適位置慢走", name_en: "Take a gentle walk in a suitable area", location_type: "outdoor", minutes: 15, energy: "low" },
      { id: "A08", name_zh: "觀察天空並畫草圖", name_en: "Observe the sky and sketch", location_type: "outdoor", minutes: 20, energy: "low" },
      { id: "A09", name_zh: "在合適位置快走", name_en: "Take a brisk walk in a suitable area", location_type: "outdoor", minutes: 30, energy: "medium" },
      { id: "A10", name_zh: "規劃小組練習", name_en: "Plan a group exercise", location_type: "indoor", minutes: 45, energy: "medium" },
      { id: "A11", name_zh: "記錄自然色彩", name_en: "Record colors in nature", location_type: "outdoor", minutes: 45, energy: "low" },
      { id: "A12", name_zh: "構思下一次社團活動", name_en: "Brainstorm a future club activity", location_type: "indoor", minutes: 60, energy: "medium" }
    ];

    const copy = {
      en: {
        eyebrow: "Between classes", title: "Campus Break Activity Picker", filters: "Filters",
        location: "Location", allLocations: "All locations", indoor: "Indoor", outdoor: "Outdoor",
        time: "Available time", energy: "Energy", allEnergy: "All energy levels", low: "Low", medium: "Medium",
        pick: "Pick an activity", reset: "Reset filters", ready: "Choose your filters, then pick an activity.",
        recent: "Recent picks", clear: "Clear history", empty: "No picks yet.", none: "No matching activities.",
        minutes: "minutes", disclaimer: "Fictional teaching activities; not an official university announcement.",
        language: "Language"
      },
      zh: {
        eyebrow: "課間時光", title: "校園休息活動挑選器", filters: "篩選條件",
        location: "地點", allLocations: "所有地點", indoor: "室內", outdoor: "戶外",
        time: "可用時間", energy: "活動強度", allEnergy: "所有強度", low: "低", medium: "中",
        pick: "隨機挑選活動", reset: "重設篩選", ready: "選好條件後，請挑選一項活動。",
        recent: "最近挑選", clear: "清除紀錄", empty: "尚無挑選紀錄。", none: "沒有符合條件的活動。",
        minutes: "分鐘", disclaimer: "虛構教學活動；非大學官方公告。", language: "語言"
      }
    };

    const locationSelect = document.querySelector("#location");
    const timeSelect = document.querySelector("#time");
    const energySelect = document.querySelector("#energy");
    const result = document.querySelector("#result");
    const historyList = document.querySelector("#history");
    const languageGroup = document.querySelector(".language");
    let language = "en";
    let history = [];
    let currentResult = null;
    let resultState = "ready";

    function localizedName(activity) {
      return activity[language === "zh" ? "name_zh" : "name_en"];
    }

    function localizedValue(value) {
      return copy[language][value] || value;
    }

    function renderResult() {
      if (resultState === "ready") {
        result.innerHTML = `<p class="hint">${copy[language].ready}</p>`;
        return;
      }
      if (resultState === "none") {
        result.innerHTML = `<p class="hint">${copy[language].none}</p>`;
        return;
      }
      const item = currentResult;
      result.innerHTML = `
        <p class="result-id">${item.id}</p>
        <h2>${localizedName(item)}</h2>
        <ul class="meta">
          <li>${item.minutes} ${copy[language].minutes}</li>
          <li>${localizedValue(item.location_type)}</li>
          <li>${localizedValue(item.energy)}</li>
        </ul>`;
    }

    function renderHistory() {
      if (!history.length) {
        historyList.innerHTML = `<li class="empty-history">${copy[language].empty}</li>`;
        return;
      }
      historyList.innerHTML = history.map(item => `
        <li>
          <span class="history-id">${item.id}</span>
          <span class="history-name">${localizedName(item)}</span>
          <span class="history-meta">${item.minutes} ${copy[language].minutes} · ${localizedValue(item.location_type)} · ${localizedValue(item.energy)}</span>
        </li>`).join("");
    }

    function updateLanguage(nextLanguage) {
      language = nextLanguage;
      document.documentElement.lang = language === "zh" ? "zh-Hant" : "en";
      document.title = copy[language].title;
      document.querySelectorAll("[data-i18n]").forEach(element => {
        element.textContent = copy[language][element.dataset.i18n];
      });
      timeSelect.querySelectorAll("option").forEach(option => {
        option.textContent = `${option.dataset.minutes} ${copy[language].minutes}`;
      });
      document.querySelector("#lang-en").classList.toggle("active", language === "en");
      document.querySelector("#lang-zh").classList.toggle("active", language === "zh");
      document.querySelector("#lang-en").setAttribute("aria-pressed", String(language === "en"));
      document.querySelector("#lang-zh").setAttribute("aria-pressed", String(language === "zh"));
      languageGroup.setAttribute("aria-label", copy[language].language);
      renderResult();
      renderHistory();
    }

    document.querySelector("#pick").addEventListener("click", () => {
      const matches = activities.filter(activity =>
        (locationSelect.value === "all" || activity.location_type === locationSelect.value) &&
        activity.minutes <= Number(timeSelect.value) &&
        (energySelect.value === "all" || activity.energy === energySelect.value)
      );

      if (!matches.length) {
        currentResult = null;
        resultState = "none";
        renderResult();
        return;
      }

      currentResult = matches[Math.floor(Math.random() * matches.length)];
      resultState = "activity";
      history.unshift(currentResult);
      history = history.slice(0, 5);
      renderResult();
      renderHistory();
    });

    document.querySelector("#reset").addEventListener("click", () => {
      locationSelect.value = "all";
      timeSelect.value = "30";
      energySelect.value = "all";
    });

    document.querySelector("#clear").addEventListener("click", () => {
      history = [];
      renderHistory();
    });

    document.querySelector("#lang-en").addEventListener("click", () => updateLanguage("en"));
    document.querySelector("#lang-zh").addEventListener("click", () => updateLanguage("zh"));

    updateLanguage("en");
  </script>
</body>
</html>
